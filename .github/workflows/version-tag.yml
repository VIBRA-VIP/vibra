name: Version tag on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-tag-main
  cancel-in-progress: false

jobs:
  tag:
    name: Create deploy version tag
    runs-on: ubuntu-latest
    # Avoid tagging the automated release bump commit itself in a loop
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if HEAD already tagged
        id: already
        run: |
          if git describe --exact-match HEAD >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "HEAD already has tag $(git describe --exact-match HEAD)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.already.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump web version, commit, tag and push
        if: steps.already.outputs.skip != 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          CURRENT="$(node -p "require('./apps/web/package.json').version")"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))"
          TAG="v${NEXT}"

          node <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const [major, minor, patch] = pkg.version.split('.').map(Number);
          pkg.version = `${major}.${minor}.${patch + 1}`;
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          console.log(pkg.version);
          NODE

          git add apps/web/package.json
          git commit -m "chore(release): v${NEXT}"
          git tag -a "$TAG" -m "Web deploy ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

          echo "Created tag ${TAG}"
