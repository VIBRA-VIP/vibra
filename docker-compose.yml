services:
  postgres:
    image: postgres:16-alpine
    container_name: vibra-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vibra
      POSTGRES_PASSWORD: vibra
      POSTGRES_DB: vibra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibra -d vibra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
