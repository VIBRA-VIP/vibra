# Netlify — Vibra web (apps/web)
# https://www.netlify.com/

[build]
  command = "pnpm run build:packages && pnpm --filter @vibra/web build"
  publish = "apps/web/dist"
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

# Proxy API through Netlify (HTTPS → Lightsail). Must be BEFORE the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "http://3.17.154.80:3000/api/:splat"
  status = 200
  force = true

# SPA (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
